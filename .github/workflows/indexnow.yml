name: Submit IndexNow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/sitemap.xml'

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X POST 'https://api.indexnow.org/IndexNow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @- <<'JSON'
          {
            "host": "medspa-software-fit.pages.dev",
            "key": "2c364a85e7fc48f2bff9b0350308a4fb",
            "keyLocation": "https://medspa-software-fit.pages.dev/2c364a85e7fc48f2bff9b0350308a4fb.txt",
            "urlList": [
              "https://medspa-software-fit.pages.dev/",
              "https://medspa-software-fit.pages.dev/med-spa-software-for-2-5-providers/",
              "https://medspa-software-fit.pages.dev/when-is-zenoti-worth-it/",
              "https://medspa-software-fit.pages.dev/med-spa-software-switching-cost/",
              "https://medspa-software-fit.pages.dev/all-in-one-vs-emr-crm-med-spa/"
            ]
          }
          JSON
